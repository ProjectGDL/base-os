- title: VPN Clients
  description: Install and manage VPN clients
  actions:
  - id: throne
    icon: throne-vpn
    title: Throne VPN
    description: Secure VPN client for encrypted connections
    default: false
    status_script: ujust throne status 2>/dev/null && echo "installed" || echo "not
      installed"
    options:
    - id: install
      label: Install/Update Throne VPN
      script: ujust throne-install; status=$?; echo; echo "Press Enter to close...";
        read -r _; exit $status
    - id: uninstall
      label: Uninstall Throne VPN
      script: ujust throne-remove; status=$?; echo; echo "Press Enter to close...";
        read -r _; exit $status
- title: Troubleshoot
  description: Tools and resources for diagnosing and fixing issues
  actions:
  - id: get-logs
    icon: text-x-log
    title: Collect system logs
    description: Gather system records into a shareable web report
    default: false
    script: ujust get-logs; status=$?; echo; echo "Press Enter to close..."; read
      -r _; exit $status
  - id: rollback-bazzite
    icon: edit-undo
    title: Rollback to the prior Bazzite deployment
    description: Revert to previous deployment if current has issues
    default: false
    script: brh rollback -y && reboot
  - id: save-panics
    icon: dialog-warning
    title: Enable saving kernel panics
    description: Toggle ramoops panic logger for crash records
    default: false
    status_script: ujust toggle-save-panics status
    options:
    - id: enable
      label: Enable Logging with «ramoops»
      script: ujust toggle-save-panics enable; status=$?; echo; echo "Press Enter
