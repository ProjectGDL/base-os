title: Project GDL Portal
screens:
- title: Welcome!
  description: Get to know Project GDL
  actions:
  - id: gdl-telegram
    icon: telegram
    title: Join our Telegram community
    description: Get help, news, and discussion
    default: false
    script: xdg-open https://t.me/+HmbbMdR-GTo2ZTIy
  - id: gdl-base-os
    icon: project-gdl
    title: Project GDL Base OS
    description: View the base OS and available releases on GitHub
    default: false
    script: xdg-open https://github.com/ProjectGDL/base-os
  - id: gdl-issues
    icon: tools-report-bug
    title: Report issues and view bug tracker
    description: Report bugs or view known issues on GitHub
    default: false
    script: xdg-open https://github.com/ProjectGDL/base-os/issues
  - id: gdl-github
    icon: github
    title: Visit our GitHub organization
    description: Explore Project GDL repositories
    default: false
    script: xdg-open https://github.com/ProjectGDL
- title: Install Applications
  description: Get and configure software
  actions:
  - id: android-platform-tools
    icon: android
    title: Android Platform Tools
    description: CLI tools for Android development
    default: false
    script: eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)" && brew install
      --cask android-platform-tools
  - id: antigravity-linux
    icon: antigravity
    title: Antigravity
    description: Google's AI-powered IDE
    default: false
    script: eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)" && brew tap ublue-os/tap
      && brew trust --tap ublue-os/tap && brew install --cask antigravity-linux
  - id: asus
    icon: asus-rog
    title: asusctl & ROG Control Center
    description: ASUS hardware management utilities
    default: false
    status_script: ujust asus status
    options:
    - id: install
      label: Install asusctl & ROG Control Center
      script: ujust asus install; status=$?; echo; echo "Press Enter to close...";
        read -r _; exit $status
    - id: uninstall
      label: Uninstall asusctl & ROG Control Center
      script: ujust asus uninstall; status=$?; echo; echo "Press Enter to close...";
        read -r _; exit $status
  - id: bazzite-cli
    icon: bazzite-cli
    title: Bazzite CLI
    description: Bluefin-style CLI setup with utilities
    default: false
    options:
    - id: enable
      label: Enable Bazzite CLI
      script: eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)" && ujust bazzite-cli
        enable; status=$?; echo; echo "Press Enter to close..."; read -r _; exit $status
    - id: disable
      label: Disable Bazzite CLI
      script: ujust bazzite-cli disable; status=$?; echo; echo "Press Enter to close...";
        read -r _; exit $status
  - id: boxtron
    icon: dosbox
    title: Boxtron
    description: DOS games via Steam Play + Distrobox
    default: false
    status_script: ujust install-boxtron status
    options:
    - id: install
      label: Install Boxtron
      script: ujust install-boxtron install; status=$?; echo; echo "Press Enter to
        close..."; read -r _; exit $status
    - id: uninstall
      label: Uninstall Boxtron
      script: ujust install-boxtron uninstall; status=$?; echo; echo "Press Enter
        to close..."; read -r _; exit $status
  - id: coolercontrol
    icon: coolercontrol
    title: CoolerControl
    description: Monitor sensors and set thermal profiles
    default: false
    status_script: ujust install-coolercontrol status
    options:
    - id: install
      label: Install CoolerControl
      script: ujust install-coolercontrol install; status=$?; echo; echo "Press Enter
        to close..."; read -r _; exit $status
    - id: uninstall
      label: Uninstall CoolerControl
      script: ujust install-coolercontrol uninstall; status=$?; echo; echo "Press
        Enter to close..."; read -r _; exit $status
  - id: davinci-resolve
    icon: davinci-resolve
    title: DaVinci Resolve
    description: Professional video editor (NLE) via davincibox
    default: false
    status_script: ujust install-davinci status
    options:
    - id: install
      label: Install/Upgrade DaVinci Resolve
      script: ujust install-davinci install; status=$?; echo; echo "Press Enter to
        close..."; read -r _; exit $status
    - id: uninstall
      label: Uninstall DaVinci Resolve
      script: ujust install-davinci uninstall; status=$?; echo; echo "Press Enter
        to close..."; read -r _; exit $status
  - id: decky-loader
    icon: decky
    title: Decky Loader
    description: Plugin loader for Steam/Steam Deck
    default: false
    status_script: ujust setup-decky status
    options:
    - id: install
      label: Install Decky
      script: ujust setup-decky install
    - id: install-prerelease
      label: Install Decky Prerelease
      script: ujust setup-decky install-prerelease
    - id: uninstall
      label: Uninstall Decky
      script: ujust setup-decky uninstall
  - id: decky-bazzite-buddy
    icon: decky-plugin
    title: Decky Plugin — Bazzite Buddy
    description: View Bazzite version changes in Game Mode
    default: false
    status_script: ujust get-decky-bazzite-buddy status
    options:
    - id: install
      label: Install Bazzite Buddy Plugin
      script: ujust get-decky-bazzite-buddy install
    - id: uninstall
      label: Uninstall Bazzite Buddy Plugin
      script: ujust get-decky-bazzite-buddy uninstall
  - id: decky-lossless-scaling
    icon: lossless-scaling
    title: Decky Plugin — Lossless Scaling
    description: Configure Lossless Scaling frame generation
    default: false
    status_script: ujust get-decky-lossless-scaling status
    options:
    - id: install
      label: Install Lossless Scaling Plugin
      script: ujust get-decky-lossless-scaling install
    - id: uninstall
      label: Uninstall Lossless Scaling Plugin
      script: ujust get-decky-lossless-scaling uninstall
  - id: decky-framegen
    icon: optiscaler
    title: Decky Plugin — OptiScaler
    description: Configure upscaling and frame generation for Steam games
    default: false
    status_script: ujust get-framegen status
    options:
    - id: install
      label: Install OptiScaler Plugin
      script: ujust get-framegen install
    - id: uninstall
      label: Uninstall OptiScaler Plugin
      script: ujust get-framegen uninstall
  - id: emudeck
    icon: emudeck
    title: EmuDeck
    description: Curated video game emulation setup for Steam Deck
    default: false
    status_script: ujust get-emudeck status
    options:
    - id: install
      label: Install EmuDeck
      script: ujust get-emudeck install
    - id: uninstall
      label: Uninstall EmuDeck
      script: ujust get-emudeck uninstall
  - id: jetbrains-toolbox-linux
    icon: jetbrains-toolbox
    title: JetBrains Toolbox
    description: Manage JetBrains IDE installs via Brew
    default: false
    script: eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)" && brew tap ublue-os/tap
      && brew trust --tap ublue-os/tap && brew install --cask jetbrains-toolbox-linux
  - id: lm-studio-linux
    icon: lm-studio
    title: LM Studio
    description: Local LLM suite via Brew
    default: false
    script: eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)" && brew tap ublue-os/tap
      && brew trust --tap ublue-os/tap && brew install --cask lm-studio-linux
  - id: lsfg-vk
    icon: lossless-scaling
    title: Lossless Scaling — Vulkan Layer
    description: Vulkan adapter for Lossless Scaling on Linux
    default: false
    status_script: ujust get-lsfg status
    options:
    - id: install
      label: Install «lsfg-vk»
      script: ujust get-lsfg install; status=$?; echo; echo "Press Enter to close...";
        read -r _; exit $status
    - id: uninstall
      label: Uninstall «lsfg-vk»
      script: ujust get-lsfg uninstall; status=$?; echo; echo "Press Enter to close...";
        read -r _; exit $status
  - id: openrazer
    icon: openrazer
    title: OpenRazer
    description: Linux support for Razer gaming hardware
    default: false
    status_script: ujust install-openrazer status
    options:
    - id: install-razer-genie
      label: Install with Razer Genie
      script: ujust install-openrazer install-razer-genie; status=$?; echo; echo "Press
        Enter to close..."; read -r _; exit $status
    - id: install-polychromatic
      label: Install with Polychromatic
      script: ujust install-openrazer install-polychromatic; status=$?; echo; echo
        "Press Enter to close..."; read -r _; exit $status
    - id: install
      label: Install without Frontend
      script: ujust install-openrazer install; status=$?; echo; echo "Press Enter
        to close..."; read -r _; exit $status
    - id: uninstall
      label: Uninstall All
      script: ujust install-openrazer uninstall; status=$?; echo; echo "Press Enter
        to close..."; read -r _; exit $status
  - id: openrgb
    icon: openrgb
    title: OpenRGB
    description: Open source RGB lighting control
    default: false
    status_script: ujust openrgb status
    options:
    - id: install
      label: Install OpenRGB
      script: ujust openrgb install
    - id: uninstall
      label: Uninstall OpenRGB
      script: ujust openrgb uninstall
  - id: opentabletdriver
    icon: opentabletdriver
    title: OpenTabletDriver
    description: Drawing tablet driver with open source
    default: false
    status_script: ujust opentabletdriver status
    options:
    - id: install
      label: Install OpenTabletDriver
      script: ujust opentabletdriver install
    - id: uninstall
      label: Uninstall OpenTabletDriver
      script: ujust opentabletdriver uninstall
  - id: resilio-sync
    icon: resilio-sync
    title: Resilio Sync
    description: File sync via BitTorrent
    default: false
    status_script: ujust resilio-sync status
    options:
    - id: install
      label: Install Resilio Sync
      script: ujust resilio-sync install
    - id: Uninstall Resilio Sync
      label: Uninstall
      script: ujust resilio-sync uninstall
  - id: steamcmd
    icon: steam
    title: SteamCMD
    description: CLI version of Steam for game servers
    default: false
    status_script: ujust get-steamcmd status
    options:
    - id: install
      label: Install SteamCMD
      script: ujust get-steamcmd install
    - id: uninstall
      label: Uninstall SteamCMD
      script: ujust get-steamcmd uninstall
  - id: sunshine
    icon: sunshine
    title: Sunshine
    description: Self-hosted video game streaming for Moonlight
    default: false
    status_script: ujust setup-sunshine status
    options:
    - id: enable
      label: Enable Sunshine
      script: ujust setup-sunshine enable
    - id: enable-brew
      label: Enable Sunshine Beta (via Brew)
      script: ujust setup-sunshine enable-beta
    - id: update
      label: Update Sunshine
      script: ujust setup-sunshine update
    - id: disable
      label: Disable Sunshine Service
      script: ujust setup-sunshine disable
    - id: uninstall
      label: Uninstall Sunshine
      script: ujust setup-sunshine uninstall
    - id: portal
      label: Open Sunshine Management Portal
      script: ujust setup-sunshine portal
  - id: visual-studio-code-linux
    icon: visual-studio-code
    title: Visual Studio Code
    description: Microsoft code editor from Brew
    default: false
    script: eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)" && brew tap ublue-os/tap
      && brew trust --tap ublue-os/tap && brew install --cask visual-studio-code-linux
  - id: vscodium-linux
    icon: vscodium
    title: VSCodium
    description: Community open source VS Code via Brew
    default: false
    script: eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)" && brew tap ublue-os/tap
      && brew trust --tap ublue-os/tap && brew install --cask vscodium-linux
  - id: waydroid
    icon: waydroid
    title: Waydroid
    description: Android container for Linux (no NVIDIA compatibility)
    default: false
    options:
    - id: init
      label: Initialize
      script: ujust configure-waydroid init
    - id: configure
      label: Configure
      script: ujust configure-waydroid configure
    - id: gpu
      label: Select GPU
      script: ujust configure-waydroid gpu
    - id: reset
      label: Reset
      script: ujust configure-waydroid reset
    - id: helper
      label: Install Helper
      script: ujust configure-waydroid helper
- title: Manage GDL
  description: System management and configuration
  actions:
  - id: update-gdl
    icon: system-software-update
    title: Update your system
    description: Update GDL, Flatpak apps, and more
    default: false
    script: ujust update
  - id: reset-gdl
    icon: edit-clear
    title: Shed system software layers
    description: Reset rpm-ostree layers to default, remove added packages
    default: false
    script: rpm-ostree reset
  - id: cancel-pending-deployment
    icon: process-stop
    title: Cancel pending deployment
    description: Remove next image deployment and halt pending updates
    default: false
    script: rpm-ostree cleanup -p; status=$?; echo; echo "Press Enter to close...";
      read -r _; exit $status
  - id: verify-image
    icon: security-high
    title: Move to a 'verified' image
    description: Detect and move to a signed Bazzite image if needed
    default: false
    script: ujust verify-image; status=$?; echo; echo "Press Enter to close..."; read
      -r _; exit $status
  - id: wake-on-lan
    icon: network-wired
    title: Enable Wake-on-LAN functionality
    description: Toggle magic packet detection for remote power-on
    default: false
    status_script: ujust wol status
    options:
    - id: enable
      label: Enable Wake-on-LAN
      script: ujust wol enable
    - id: disable
      label: Disable Wake-on-LAN
      script: ujust wol disable
    - id: force-enable
      label: Force Enable Wake-on-LAN
      script: ujust wol force-enable
  - id: ssh-service
    icon: network-server
    title: Enable SSH remote access
    description: Toggle SSH service for remote management
    default: false
    status_script: ujust ssh status
    options:
    - id: enable
      label: Enable SSH Access
      script: ujust ssh enable
    - id: disable
      label: Disable SSH Access
      script: ujust ssh disable
  - id: hide-grub
    icon: preferences-system
    title: Manage GRUB menu visibility
    description: Configure GRUB menu appearance at boot
    default: true
    options:
    - id: hide
      label: Hide After Successful Boot
      script: ujust configure-grub hide
    - id: unhide
      label: Hide, Except in Dual-Booting
      script: ujust configure-grub unhide
    - id: show
      label: Always Show GRUB
      script: ujust configure-grub show
  - id: grub-timeout
    icon: chronometer
    title: Configure GRUB menu timeout
    description: Set GRUB wait time before default boot
    default: false
    options:
    - id: no-timeout
      label: No Timeout
      script: ujust grub-timeout no-timeout
    - id: instant
      label: Skip Menu (F8 or Shift to show GRUB)
      script: ujust grub-timeout instant
    - id: 1-second
      label: Timeout After 1 Second
      script: ujust grub-timeout 1-second
    - id: 3-seconds
      label: Timeout After 3 Seconds
      script: ujust grub-timeout 3-seconds
    - id: 5-seconds
      label: Timeout After 5 Seconds
      script: ujust grub-timeout 5-seconds
    - id: 10-seconds
      label: Timeout After 10 Seconds
      script: ujust grub-timeout 10-seconds
    - id: custom
      label: Wait a Custom Amount
      script: ujust grub-timeout custom
  - id: Reboot to UEFI
    icon: system-reboot
    title: Reboot to UEFI firmware settings
    description: Reboot to UEFI for boot/firmware changes
    default: false
    script: systemctl reboot --firmware-setup
- title: Tweak Systems
  description: System adjustments and tools
  actions:
  - id: add-input-group
    icon: input-gaming
    title: Add «input» to your user groups
    description: Required by controllers and CBF
    default: true
    status_script: ujust add-user-to-input-group status
    options:
    - id: add
      label: Add User to «input» Group
      script: ujust add-user-to-input-group add
    - id: remove
      label: Remove User from «input» Group
      script: ujust add-user-to-input-group remove
  - id: boot-to-windows
    icon: distributor-logo-windows
    title: Boot to Windows from Steam
    description: Add Steam shortcut for dual-boot Windows
    default: false
    script: ujust setup-boot-windows-steam
  - id: steam-icons
    icon: desktop
    title: Clean Steam desktop icons automatically
    description: Remove Steam-generated desktop icons via login script
    default: false
    status_script: ujust steam-icons status
    options:
    - id: remove
      label: One-Time Removal
      script: ujust steam-icons remove
    - id: enable
      label: Enable Auto-Cleanup
      script: ujust steam-icons enable
    - id: disable
      label: Disable Auto-Cleanup
      script: ujust steam-icons disable
  - id: snapper
    icon: drive-harddisk
    title: Configure btrfs snapshots
    description: Manage Snapper snapshots for /var/home
    default: false
    status_script: ujust configure-snapshots status
    options:
    - id: enable
      label: Enable Automatic Snapshots
      script: ujust configure-snapshots enable
    - id: disable
      label: Disable Automatic Snapshots
      script: ujust configure-snapshots disable
    - id: wipe
      label: Disable and Wipe Automatic Snapshots
      script: ujust configure-snapshots wipe
    - id: btrfs-assistant
      label: Open Btrfs Assistant
      script: setsid -f gtk-launch btrfs-assistant.desktop >/dev/null 2>&1
  - id: watchdog
    icon: chronometer
    title: Disable watchdog recovery mechanisms
    description: Toggle watchdog recovery under failure conditions
    default: false
    status_script: ujust configure-watchdog status
    options:
    - id: enable
      label: Enable Watchdog Recovery
      script: ujust configure-watchdog enable; status=$?; echo; echo "Press Enter
        to close..."; read -r _; exit $status
    - id: disable
      label: Disable Watchdog Recovery
      script: ujust configure-watchdog disable; status=$?; echo; echo "Press Enter
        to close..."; read -r _; exit $status
  - id: global-dlss
    icon: nvidia-dlss
    title: Enable globally upgrading DLSS
    description: Toggle DLSS auto-upgrade (requires Proton-GE, etc.)
    default: false
    options:
    - id: enable
      label: Enable Autoupgrading DLSS
      script: ujust global-dlss enable
    - id: disable
      label: Disable Autoupgrading DLSS
      script: ujust global-dlss disable
  - id: global-fsr4-rdna3
    icon: amd-fsr
    title: Enable globally upgrading FSR3.1+ to FSR4 — for RDNA3 graphics cards
    description: Toggle FSR auto-upgrade for RDNA3 (7000 series)
    default: false
    options:
    - id: enable
      label: Enable Autoupgrading FSR (RDNA3)
      script: ujust global-fsr4-rdna3 enable
    - id: disable
      label: Disable Autoupgrading FSR (RDNA3)
      script: ujust global-fsr4-rdna3 disable
  - id: global-fsr4
    icon: amd-fsr
    title: Enable globally upgrading FSR3.1+ to FSR4 — for RDNA4 graphics cards
    description: Toggle FSR auto-upgrade (requires Proton 10+)
    default: false
    options:
    - id: enable
      label: Enable Autoupgrading FSR
      script: ujust global-fsr4 enable
    - id: disable
      label: Disable Autoupgrading FSR
      script: ujust global-fsr4 disable
  - id: password-asterisks
    icon: dialog-password
    title: Enable visible password asterisks in CLI
    description: Show feedback for sudo password input
    default: false
    options:
    - id: 'on'
      label: Show Password Asterisks
      script: ujust password-feedback on
    - id: 'off'
      label: Hide Password Asterisks
      script: ujust password-feedback off
  - id: displaylink
    icon: video-display
    title: Install support for DisplayLink
    description: Manage DisplayLink for docks and USB adapters
    default: false
    status_script: ujust install-displaylink status
    options:
    - id: install
      label: Install DisplayLink Support
      script: ujust install-displaylink install; status=$?; echo; echo "Press Enter
        to close..."; read -r _; exit $status
    - id: uninstall
      label: Uninstall DisplayLink Support
      script: ujust install-displaylink uninstall; status=$?; echo; echo "Press Enter
        to close..."; read -r _; exit $status
  - id: configure-beesd
