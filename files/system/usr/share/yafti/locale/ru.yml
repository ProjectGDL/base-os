"Install and manage VPN clients": "Установка и управление VPN-клиентами"
"Throne VPN": "Throne VPN"
"A secure VPN client for encrypted network connections.": "Безопасный VPN-клиент для зашифрованных сетевых подключений."
"Install/Update Throne VPN": "Установить/обновить Throne VPN"
"Uninstall Throne VPN": "Удалить Throne VPN"
"Troubleshoot": "Устранение неполадок"
"Tools and resources for diagnosing and fixing issues": "Инструменты и ресурсы для диагностики и решения проблем"
"Collect system logs": "Собрать системные журналы"
"Gather system records and information into a shareable web page report.": "Соберите системные записи и сведения в общий отчёт в виде веб-страницы."
"Rollback to the prior Bazzite deployment": "Откат к предыдущему развёртыванию Bazzite"
"Revert the ‘current deployment’ back to the former one. May be useful if the booted image has an issue.": "Верните «текущее развёртывание» к предыдущему. Может быть полезно, если в загруженном образе есть проблемы."
"Enable saving kernel panics": "Включить сохранение сбоев ядра"
"Toggle the «ramoops» panic logger to keep system crash records on reboot.": "Включение/отключение журнала сбоев «ramoops» для сохранения записей о сбоях после перезагрузки."
"Enable Logging with «ramoops»": "Включить журналирование с «ramoops»"
"Disable Logging with «ramoops»": "Отключить журналирование с «ramoops»"
"Terminate all Wine/Proton processes": "Завершить все процессы Wine/Proton"
"Send «kill» signal to processes pertaining to Wine/Proton. May be useful if a task seems to be stuck.": "Отправьте сигнал «kill» процессам, относящимся к Wine/Proton. Может пригодиться, если задача зависла."
"Patch 64-bit beta version for Garry's Mod": "Исправить 64-битную бета-версию Garry's Mod"
"Fix many issues with the native 64-bit Linux version of Garry's Mod through a third-party patch.": "Исправление многих проблем нативной 64-битной Linux-версии Garry's Mod с помощью стороннего патча."
"Reset Steam installation": "Сбросить установку Steam"
"Remove local Steam files and reacquire them fresh from Valve servers. Will not delete game or save files!": "Удалите локальные файлы Steam и заново получите их с серверов Valve. Файлы игр и сохранений не будут удалены!"
"Restart PipeWire service": "Перезапустить службу PipeWire"
"Restart the user service for audio, video sharing, and MIDI device connections.": "Перезапустите пользовательскую службу для аудио, обмена видео и подключения MIDI-устройств."
"Disable microphone in Bluetooth headsets": "Отключить микрофон в Bluetooth-гарнитурах"
"Toggle microphone profile to ensure certain Bluetooth devices maintain full playback quality.": "Переключение профиля микрофона, чтобы обеспечить полноценное качество воспроизведения на некоторых Bluetooth-устройствах."
"Disable Microphone Profile": "Отключить профиль микрофона"
"Enable Microphone Profile": "Включить профиль микрофона"
"Change CEC mode": "Изменить режим CEC"
"Toggle the HDMI-CEC back-end path. Routing through the dedicated GPU should be more reliable for home theater PCs, while routing natively could be preferred in handhelds.": "Переключение внутреннего пути HDMI-CEC. Маршрутизация через выделенный GPU надёжнее для домашних кинотеатров, тогда как нативная может быть предпочтительна на портативных устройствах."
"Route through dGPU": "Маршрутизация через dGPU"
"Route Natively": "Нативная маршрутизация"
"Change Wi-Fi system back-end": "Изменить внутренний механизм Wi-Fi"
"Toggle between the default «iwd» and legacy «wpa_supplicant» as the software Wi-Fi back-end.": "Переключение между стандартным «iwd» и устаревшим «wpa_supplicant» в качестве программного механизма Wi-Fi."
"Reset to «iwd»": "Сбросить на «iwd»"
"Switch to «wpa_supplicant»": "Переключить на «wpa_supplicant»"
"Configure power saving for Intel HD Graphics": "Настроить энергосбережение для Intel HD Graphics"
"Manage the «i915.enable_dc» power-saving setting for older i915 Intel GPUs with suspend issues.": "Управление настройкой энергосбережения «i915.enable_dc» для старых GPU Intel i915 с проблемами приостановки."
"Set to Auto (i915.enable_dc=-1)": "Установить «Авто» (i915.enable_dc=-1)"
"Disable Power Saving (i915.enable_dc=0)": "Отключить энергосбережение (i915.enable_dc=0)"
"Set to Level 1 (i915.enable_dc=1)": "Уровень 1 (i915.enable_dc=1)"
"Set to Level 2 (i915.enable_dc=2)": "Уровень 2 (i915.enable_dc=2)"
"Set to Level 3 (i915.enable_dc=3)": "Уровень 3 (i915.enable_dc=3)"
"Set to Level 4 (i915.enable_dc=4)": "Уровень 4 (i915.enable_dc=4)"
"Unset Parameter": "Убрать параметр"
"Run basic processor benchmark": "Запустить базовую проверку процессора"
"Start a one-minute CPU performance assessment.": "Запуск одноминутной оценки производительности процессора."
"Enable REISUB failure recovery": "Включить восстановление REISUB"
"Toggle the ‘magic’ SysRq key and allow using the REISUB shortcut to force-reboot your computer slightly more safely. Not recommended, as it allows bypassing certain security features.": "Включение/отключение «магической» клавиши SysRq и возможности принудительной перезагрузки с помощью REISUB. Не рекомендуется, так как позволяет обходить некоторые функции безопасности."
"Enable REISUB Recovery": "Включить восстановление REISUB"
"Disable REISUB Recovery": "Отключить восстановление REISUB"
"Regenerate GRUB configuration file": "Пересоздать файл конфигурации GRUB"
"Use the current parameters to generate a new GRUB configuration file. This will probe again for a Windows installation to appear as a boot option.": "Используйте текущие параметры для создания нового файла конфигурации GRUB. Будет повторно проверено наличие установленной Windows как варианта загрузки."
